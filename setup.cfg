[coverage:run]
source = app
omit = 
    */tests/*
    */site-packages/*
    */python?.?/*
    app/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    except ImportError:
    if not TYPE_CHECKING:
    if sys.version_info
    pass

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = /htmlcov/

[coverage:xml]
output = coverage.xml

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --strict-markers
    --tb=short
    -ra
markers =
    asyncio: mark test as async
    integration: mark test as integration
    slow: mark test as slow
    unit: mark test as unit

# Fixture scope defaults
fixture_strictness = "error"
