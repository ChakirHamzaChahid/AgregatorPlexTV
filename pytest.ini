[pytest]
# pytest configuration for PlexHub
# Minimum version
minversion = 7.0

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Markers
markers =
    asyncio: Async tests (pytest-asyncio)
    integration: End-to-end integration tests
    slow: Slow tests (perf regression, stress)
    unit: Fast unit tests
    api: API endpoints tests
    streaming: Streaming & proxy tests
    cache: Cache tests

# Logging
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
addopts =
    --strict-markers
    --tb=short
    -ra

# Timeout
timeout = 10

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test paths
testpaths = tests

# Cache
cache_dir = .pytest_cache

# Documentation
console_output_style = progress
